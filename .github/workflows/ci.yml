---
name: CI

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (typecheck all packages)
        run: pnpm -r lint

      - name: Build
        run: pnpm turbo build

      - name: Test (all packages)
        run: pnpm -r test

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Worker name (aiusage) and D1 database identity (aiusage-db /
      # 9afb8ff2-a46b-4edb-ac9e-ea5471f19eb7) live in packages/worker/wrangler.jsonc.
      # (Removed the old inject step: it referenced CLOUDFLARE_WORKER_NAME /
      # CLOUDFLARE_D1_DATABASE_ID secrets that do not exist on this repository.)
      - name: Build Dashboard & prepare Worker public assets
        run: |
          pnpm --filter @aiusage/dashboard build
          cp -r packages/dashboard/dist packages/worker/public

      - name: Apply D1 migrations (aiusage-db, remote)
        run: npx wrangler d1 migrations apply aiusage-db --remote
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker (shared primitive)
        uses: 0verme/ci-workflows/.github/actions/cloudflare-worker-deploy@v1
        with:
          working_directory: packages/worker
          command: deploy
          # Match the project-pinned wrangler (devDependency 4.80.0) used by the
          # D1 migration step above; the Action default (3.90.0) predates the
          # ratelimits/cache/assets config shapes in this repository.
          wrangler_version: 4.80.0
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Guard: NPM_TOKEN is not configured on this repo (verified 2026-08-26);
      # without it the publish step always failed with ENEEDAUTH on main push.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: >-
          pnpm turbo build --filter @aiusage/pricing
          --filter @0verme/aiusage-cli

      - name: Publish packages (if versions are new)
        if: env.NPM_TOKEN != ''
        run: |
          publish_if_new() {
            local pkg_dir="$1"
            local allow_first_publish="${2:-true}"
            local pkg_name
            local local_version
            local npm_version
            pkg_name=$(node -p "require('./${pkg_dir}/package.json').name")
            local_version=$(
              node -p "require('./${pkg_dir}/package.json').version"
            )
            if npm view \
              "${pkg_name}@${local_version}" version >/dev/null 2>&1; then
              echo "${pkg_name} v${local_version} already published, skipping"
              return 0
            fi

            npm_version=$(
              npm view "${pkg_name}" version 2>/dev/null || echo "none"
            )
            if [ "${npm_version}" = "none" ] \
              && [ "${allow_first_publish}" != "true" ]; then
              echo "${pkg_name} has not been published before;" \
                "skipping until npm package permissions are created"
              return 0
            fi

            echo "Publishing ${pkg_name}@${local_version}" \
              "(npm latest is ${npm_version})"
            (cd "${pkg_dir}" && npm publish --access public)
          }

          publish_if_new packages/cli true
          publish_if_new packages/pricing false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
