---
name: CI

"on":
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (typecheck all packages)
        run: pnpm -r lint

      - name: Build
        run: pnpm turbo build

      - name: Test (all packages)
        run: pnpm -r test

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Inject Cloudflare deployment config
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_D1_DATABASE_ID"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/worker/wrangler.jsonc';
          let config = fs.readFileSync(path, 'utf8');
          if (process.env.CLOUDFLARE_WORKER_NAME) {
            config = config.replace(
              /"name":\s*"[^"]+"/,
              `"name": "${process.env.CLOUDFLARE_WORKER_NAME}"`,
            );
          }
          const databaseId = JSON.stringify(
            process.env.CLOUDFLARE_D1_DATABASE_ID,
          );
          if (/"database_id":\s*"[^"]+"/.test(config)) {
            config = config.replace(
              /"database_id":\s*"[^"]+"/,
              `"database_id": ${databaseId}`,
            );
          } else {
            config = config.replace(
              /("database_name":\s*"[^"]+")/,
              `$1,\n      "database_id": ${databaseId}`,
            );
          }
          fs.writeFileSync(path, config);
          NODE
        env:
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Build Dashboard & Deploy Worker
        run: |
          pnpm --filter @aiusage/dashboard build
          cp -r packages/dashboard/dist packages/worker/public
          cd packages/worker
          npx wrangler d1 migrations apply aiusage-db --remote
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: >-
          pnpm turbo build --filter @aiusage/pricing
          --filter @0verme/aiusage-cli

      - name: Publish packages (if versions are new)
        run: |
          publish_if_new() {
            local pkg_dir="$1"
            local allow_first_publish="${2:-true}"
            local pkg_name
            local local_version
            local npm_version
            pkg_name=$(node -p "require('./${pkg_dir}/package.json').name")
            local_version=$(
              node -p "require('./${pkg_dir}/package.json').version"
            )
            if npm view \
              "${pkg_name}@${local_version}" version >/dev/null 2>&1; then
              echo "${pkg_name} v${local_version} already published, skipping"
              return 0
            fi

            npm_version=$(
              npm view "${pkg_name}" version 2>/dev/null || echo "none"
            )
            if [ "${npm_version}" = "none" ] \
              && [ "${allow_first_publish}" != "true" ]; then
              echo "${pkg_name} has not been published before;" \
                "skipping until npm package permissions are created"
              return 0
            fi

            echo "Publishing ${pkg_name}@${local_version}" \
              "(npm latest is ${npm_version})"
            (cd "${pkg_dir}" && npm publish --access public)
          }

          publish_if_new packages/cli true
          publish_if_new packages/pricing false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # TEMPORARY diagnostic job — read-only D1 auth investigation.
  # Will be removed before merge; not part of the final CI chain.
  d1-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Token identity (read-only verify endpoint)
        run: |
          echo "== GET /user/tokens/verify =="
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Account resolution (read-only)
        run: |
          echo "== GET /accounts/{id} =="
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          echo
          echo "== GET /memberships (account context of token) =="
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/memberships?per_page=5"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Control probes (read-only, same token+account)
        run: |
          echo "== Workers scripts list =="
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts?per_page=1"
          echo
          echo "== Pages projects list =="
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=1"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: D1 list (read-only)
        run: |
          echo "== GET /d1/database =="
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=20"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: D1 by-id (read-only, id from repo wrangler.jsonc)
        run: |
          DB_ID=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/worker/wrangler.jsonc','utf8').replace(/\/\/.*$/gm,'')).d1_databases[0].database_id")
          echo "database_id from repo config: ${DB_ID}"
          echo "== GET /d1/database/{id} =="
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wrangler D1 list (project-local wrangler, read-only)
        run: |
          cd packages/worker
          npx wrangler d1 list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
